<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>hBN Quantum Photonics Paper Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Hexagonal Boron Nitride (hBN) 藍光量子發射體與 Stark Effect 學術論文知識庫">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 簡潔、無花俏圖標的學術極簡風格 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  
  <style>
    :root {
      --theme-color: #1e3a5f;
      --sidebar-width: 280px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #24292f;
      line-height: 1.7;
    }
    .markdown-section h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.4em;
    }
    .markdown-section h2 {
      font-size: 1.45rem;
      font-weight: 600;
      color: #1e293b;
      margin-top: 1.6em;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.2em;
    }
    .markdown-section h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #334155;
    }
    .markdown-section blockquote {
      border-left: 3px solid #64748b;
      background: #f8fafc;
      color: #475569;
      padding: 10px 16px;
      margin: 1em 0;
    }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.2em 0;
    }
    .markdown-section th, .markdown-section td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-section th {
      background: #f1f5f9;
      font-weight: 600;
    }
    .sidebar {
      background-color: #fafbfc;
      border-right: 1px solid #eaecef;
    }
    .sidebar-nav ul {
      padding-left: 15px;
    }
    .app-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
      padding: 16px 0 8px 0;
    }
    /* KaTeX 渲染顯示優化 */
    .katex-display {
      margin: 1em 0;
      overflow-x: auto;
      overflow-y: hidden;
    }
  </style>
</head>
<body>
  <div id="app">載入中...</div>
  <script>
    window.$docsify = {
      name: 'hBN Quantum Photonics Wiki',
      repo: '',
      loadSidebar: 'wiki/_sidebar.md',
      homepage: 'wiki/index.md',
      auto2top: true,
      subMaxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜尋論文、概念、缺陷...',
        noData: '查無結果',
        depth: 4
      }
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- 穩定可靠的 KaTeX 外掛載入鏈 -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

  <!-- 程式碼語法高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
