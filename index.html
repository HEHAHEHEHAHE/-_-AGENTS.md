<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>hBN Quantum Photonics Paper Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Persistent Academic Knowledge Base for hBN Blue Quantum Emitters and Stark Effect">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme style -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX CSS for LaTeX math rendering -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  
  <style>
    :root {
      --theme-color: #1e3a8a; /* Academic Deep Navy */
      --sidebar-width: 280px;
    }
    .app-name-link img {
      width: 32px;
      margin-right: 8px;
      vertical-align: middle;
    }
    .markdown-section h1 {
      color: #1e3a8a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.3em;
    }
    .markdown-section h2 {
      color: #1e293b;
      margin-top: 1.5em;
    }
    .markdown-section h3 {
      color: #334155;
    }
    .markdown-section blockquote {
      border-left: 4px solid #3b82f6;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
    }
    .tag {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.85em;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div id="app">Loading hBN Quantum Photonics Knowledge Base...</div>
  <script>
    window.$docsify = {
      name: '⚛️ hBN Quantum Photonics Wiki',
      repo: '',
      loadSidebar: 'wiki/_sidebar.md',
      homepage: 'wiki/index.md',
      auto2top: true,
      subMaxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search papers, concepts, defects...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- LaTeX Math rendering via KaTeX -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
